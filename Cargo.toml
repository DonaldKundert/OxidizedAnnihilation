[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[workspace.dependencies]
tak-vfs = { path = "crates/tak-vfs" }
tak-formats = { path = "crates/tak-formats" }
tak-math = { path = "crates/tak-math" }
tak-script = { path = "crates/tak-script" }
tak-content = { path = "crates/tak-content" }
tak-commands = { path = "crates/tak-commands" }
tak-sim = { path = "crates/tak-sim" }
tak-input = { path = "crates/tak-input" }
tak-headless = { path = "crates/tak-headless" }

clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
debug = 1
